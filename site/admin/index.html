<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>پنل مدیریت مجله</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#183459;--green:#3FA65E;--line:#e2e8ef;--muted:#5d6b7c;--bg:#f4f7fa}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma;background:var(--bg);color:#1b2430}
button,input,select,textarea{font-family:inherit;font-size:15px}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#22497a)}
.box{background:#fff;border-radius:20px;padding:34px;width:min(400px,92%);box-shadow:0 20px 50px -20px #000}
.box h1{margin:0 0 4px;color:var(--navy);font-size:24px}.box p{color:var(--muted);margin:0 0 20px;font-size:14px}
label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea{min-height:320px;direction:rtl;line-height:1.9}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer}
.btn.navy{background:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.red{background:#d9534f}
.err{color:#d9534f;font-size:14px;min-height:20px;margin-top:10px}
.ok{color:var(--green)}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 24px}
.top b{flex:1}.top a{color:#9be3b1}
.tabs{display:flex;gap:6px;padding:16px 24px 0}
.tabs button{border:0;background:transparent;padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button.on{background:#fff;color:var(--navy)}
.panel{background:#fff;margin:0 24px 24px;border-radius:0 14px 14px 14px;padding:22px}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:14.5px}
th{color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{padding:2px 10px;border-radius:20px;font-size:12px;background:#e8f5ec;color:#2f8a4b}.pill.off{background:#eee;color:#888}
.setup{max-width:720px;margin:60px auto;background:#fff;border-radius:16px;padding:30px;line-height:2}
.setup code{background:#eef3f9;padding:2px 6px;border-radius:6px;direction:ltr;display:inline-block}
img.prev{max-width:220px;border-radius:10px;margin-top:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
